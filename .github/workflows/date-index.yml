# Rebuilds data/date-index.json from Robinhood Chain and commits it if changed.
# The site serves the committed JSON statically — visitors never touch the RPC,
# so public-RPC outages only ever delay the next refresh, never break the page.
# Timing moved to Google Cloud Scheduler on 2026-08-29 (project web3ai-469609,
# job uday-date-index). GitHub's own cron had drifted to 10-11 hour gaps against a
# 15-minute schedule, which pushed three of six gift roots hours into the day
# they were for. Cloud Scheduler POSTs to this workflow's dispatches endpoint,
# so everything below still runs here — only the clock is elsewhere.
#
# HOURLY, and that is a ceiling rather than a compromise. Every run that finds
# a change commits, every commit to main is a Vercel deployment, and the plan
# allows 100 a day. At */15 this job alone was 96 of them: preview deployments
# stopped being built entirely, which is how it surfaced — a branch pushed to
# GitHub simply had no preview URL. Cheap to miss, because GitHub's broken cron
# had been firing this two or three times a day and hiding the cost; making the
# clock reliable is what made the waste real.
#
# Raising it again means paying Vercel for deployments nobody reads. The data
# does not move that fast: the collection trades ~17 times a day, and the site
# has never promised a refresh interval.
name: date-index
on:
  # So a deploy refreshes it too. No loop: this job commits with the default
  # GITHUB_TOKEN, and GitHub does not start workflows from those pushes.
  push:
    branches: [main]
  workflow_dispatch: {}          # manual runs from the Actions tab
permissions:
  contents: write
concurrency:
  group: date-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build index
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: python3 tools/build_date_index.py build
      - name: Build communities
        # a no-op until data/community-contract.txt exists, so this stays green
        # from the moment it is added rather than from the moment it is used
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: python3 tools/build_communities.py
      - name: Snapshot fee ledger
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: python3 tools/snapshot_ledger.py
      - name: Commit if changed
        # art-cache.json MUST be committed too: the index is derived from the
        # cache each run, so a reveal discovered by the rotating recheck slice
        # would flicker back to unrevealed next run if only the index landed.
        run: |
          git add data/date-index.json data/art-cache.json data/gift-ledger.json
          git add data/communities.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "uday-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh date index"
          # a human push can land mid-build; rebase (our fresh data wins the
          # data files) and retry instead of failing the whole hour
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs
          done
          git push
