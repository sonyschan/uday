# Posts the daily Claim Gift merkle root just after 00:00 UTC+8 and commits
# the proof file the site serves. The POSTER_PRIVATE_KEY secret is a dedicated
# low-privilege key: setRoot is append-only and gated to poster/owner, so it
# can never rewrite a posted day or touch the float. Manual fallback stays
# local: tools/post-gift.sh (owner keystore).
name: post-gift
on:
  schedule:
    - cron: '5 16 * * *'   # 00:05 UTC+8 — GHA cron jitter can add ~30-40 min
  workflow_dispatch: {}    # manual runs from the Actions tab (posts TODAY's root)
permissions:
  contents: write
concurrency:
  group: post-gift
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1   # cast: keccak for the tree, send for the root
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and post today's root
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          POSTER_PRIVATE_KEY: ${{ secrets.POSTER_PRIVATE_KEY }}
        run: bash tools/ci-post-gift.sh
      - name: Commit proofs if changed
        run: |
          git add data/gift
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "uday-gift-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "gift: daily root proofs"
          # the 15-min index bot can land a push mid-run; rebase and retry
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs
          done
          git push
