# Posts the daily Claim Gift merkle root just after 00:00 UTC+8 and commits
# the proof file the site serves. The POSTER_PRIVATE_KEY secret is a dedicated
# low-privilege key: setRoot is append-only and gated to poster/owner, so it
# can never rewrite a posted day or touch the float. Manual fallback stays
# local: tools/post-gift.sh (owner keystore).
# Timing moved to Google Cloud Scheduler on 2026-08-29 (project web3ai-469609,
# job uday-post-gift). GitHub's own cron had drifted to 10-11 hour gaps against a
# 15-minute schedule, which pushed three of six gift roots hours into the day
# they were for. Cloud Scheduler POSTs to this workflow's dispatches endpoint,
# so everything below still runs here — only the clock is elsewhere.
name: post-gift
on:
  # So a deploy also makes sure today's root is up. Safe to run repeatedly:
  # ci-post-gift.sh reads roots(dayId) first and exits if the day is posted.
  push:
    branches: [main]
  workflow_dispatch: {}    # manual runs from the Actions tab (posts TODAY's root)
permissions:
  contents: write
concurrency:
  group: post-gift
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # PINNED. The unpinned action installs the latest cast, and a release
      # after 2026-08-26 probes the endpoint with anvil_nodeInfo to work out
      # the network family. Robinhood's RPC answers that with a 400, so every
      # cast call died with "failed to determine network family from endpoint"
      # and a whole day's gift never got posted. This chain will never
      # implement anvil methods, so the version is ours to choose.
      - uses: foundry-rs/foundry-toolchain@v1   # cast: keccak for the tree, send for the root
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and post today's root
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          POSTER_PRIVATE_KEY: ${{ secrets.POSTER_PRIVATE_KEY }}
        run: bash tools/ci-post-gift.sh
      - name: Commit proofs if changed
        run: |
          git add data/gift
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "uday-gift-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "gift: daily root proofs"
          # the 15-min index bot can land a push mid-run; rebase and retry
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs
          done
          git push
