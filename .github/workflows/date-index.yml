# Rebuilds data/date-index.json from Robinhood Chain and commits it if changed.
# The site serves the committed JSON statically — visitors never touch the RPC,
# so public-RPC outages only ever delay the next refresh, never break the page.
#
# NOTE: this file cannot be pushed by Claude Code (its token lacks the
# `workflow` OAuth scope) — the owner pushes it.
name: date-index
on:
  schedule:
    - cron: '17 * * * *'        # hourly, off the minute-0 rush
  workflow_dispatch: {}          # manual runs from the Actions tab
permissions:
  contents: write
concurrency:
  group: date-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build index
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: python3 tools/build_date_index.py build
      - name: Snapshot fee ledger
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: python3 tools/snapshot_ledger.py
      - name: Commit if changed
        # art-cache.json MUST be committed too: the index is derived from the
        # cache each run, so a reveal discovered by the rotating recheck slice
        # would flicker back to unrevealed next run if only the index landed.
        run: |
          git add data/date-index.json data/art-cache.json data/gift-ledger.json
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "uday-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh date index"
          # a human push can land mid-build; rebase (our fresh data wins the
          # data files) and retry instead of failing the whole hour
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs
          done
          git push
